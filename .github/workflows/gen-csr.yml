name: Gen Signing CSR (EC)
on:
  push:
    paths: ['.github/workflows/gen-csr.yml']
  workflow_dispatch:
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Generate EC keystore + CSR
        run: |
          {
          keytool -genkeypair -alias hys -keyalg EC -groupname secp256r1             -validity 9125 -keystore hys-ec.p12 -storetype PKCS12             -storepass hys123456 -keypass hys123456             -dname "C=CN, ST=Shanxi, L=Xinzhou, O=mowu, OU=dev, CN=mowu"
          keytool -certreq -sigalg SHA256withECDSA -alias hys -keystore hys-ec.p12             -storepass hys123456 -file hys-ec.csr
          keytool -list -v -keystore hys-ec.p12 -storepass hys123456
          cat hys-ec.csr
          } > gen.log 2>&1
          cat gen.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signing-ec
          path: |
            gen.log
            hys-ec.csr
            hys-ec.p12
          if-no-files-found: warn
