name: Gen Signing CSR
on:
  workflow_dispatch:
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Generate keystore + CSR
        run: |
          keytool -genkeypair -alias hys -keyalg RSA -keysize 2048 -validity 9125             -keystore hys.p12 -storetype PKCS12 -storepass hys123456 -keypass hys123456             -dname CN=mowu, OU=dev, O=mowu, L=Xinzhou, ST=Shanxi, C=CN
          keytool -certreq -alias hys -keystore hys.p12 -storepass hys123456 -file hys.csr
          echo '--- CSR ---'; cat hys.csr
          echo '--- p12 sha256 ---'; sha256sum hys.p12
      - uses: actions/upload-artifact@v4
        with:
          name: signing
          path: |
            hys.p12
            hys.csr
