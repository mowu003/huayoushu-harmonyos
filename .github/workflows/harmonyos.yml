name: Probe
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/sanchuanhehe/harmony-next-pipeline-docker/harmonyos-ci-image:v6.0.0.418SP-rc1
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          {
          echo '### bin'; ls -la /opt/harmonyos-tools/command-line-tools/bin/
          echo '### sdkmgr'; find / -xdev -name 'sdkmgr*' -o -xdev -name 'sdkmanager*' 2>/dev/null | head
          echo '### sdkmgr version'; /opt/harmonyos-tools/command-line-tools/bin/sdkmgr --version 2>&1 | head -10
          echo '### sdkmgr list'; timeout 90 /opt/harmonyos-tools/command-line-tools/bin/sdkmgr list 2>&1 | head -60
          } > probe.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe
          path: probe.log
