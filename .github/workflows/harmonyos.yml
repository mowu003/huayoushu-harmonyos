name: Probe
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/sanchuanhehe/harmony-next-pipeline-docker/harmonyos-ci-image:v5.0.4
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          set +e
          {
          echo '### hvigor version'; cat /opt/harmonyos-tools/command-line-tools/hvigor/package.json | head -8
          echo '### ohpm version'; cat /opt/harmonyos-tools/command-line-tools/ohpm/package.json 2>/dev/null | head -8
          echo '### sdk-pkg'; cat /opt/harmonyos-tools/command-line-tools/sdk/default/sdk-pkg.json
          echo '### hms ets'; cat /opt/harmonyos-tools/command-line-tools/sdk/default/hms/ets/oh-uni-package.json 2>/dev/null
          echo '### repo hvigor-config'; cat hvigor/hvigor-config.json5
          echo '### hvigorw --version'; hvigorw --version 2>&1 | head -30
          } > probe.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe
          path: probe.log
