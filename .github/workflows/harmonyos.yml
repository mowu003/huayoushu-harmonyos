name: Probe API
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  CLT_URL: https://github.com/jerry-271828/harmonyos-commandline-tools/releases/download/v26.0.0.461
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - id: c
        uses: actions/cache@v4
        with: { path: /opt/clt, key: clt-26.0.0.461 }
      - if: steps.c.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /opt/clt && sudo chown $USER /opt/clt
          curl -fL -o a $CLT_URL/clt.zip.part00; curl -fL -o b $CLT_URL/clt.zip.part01
          cat a b > c.zip && unzip -q c.zip -d /opt/clt
      - name: Grep
        run: |
          {
          SDK=$(find /opt/clt -maxdepth 6 -type d -name ets -path '*openharmony*' | head -1); echo SDK=$SDK
          echo '===== FloatingBallController ====='
          grep -rl 'FloatingBallController' $SDK/api 2>/dev/null | head
          sed -n '/declare class FloatingBallController/,/^}/p' $SDK/api/@ohos.arkui.FloatingBall.d.ts 2>/dev/null | head -120
          echo '===== FloatViewConfiguration ====='
          sed -n '/interface FloatViewConfiguration/,/^  }/p' $SDK/api/@ohos.arkui.FloatView.d.ts 2>/dev/null | head -60
          echo '===== startSelf ====='
          grep -rn 'startSelf' $SDK/api 2>/dev/null | head -5
          } > probe.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: probe, path: probe.log }
