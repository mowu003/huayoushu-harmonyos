name: Build HarmonyOS HAP

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/sanchuanhehe/harmony-next-pipeline-docker/harmonyos-ci-image:v5.0.4
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (ohpm)
        run: ohpm install --all 2>&1 | tee ohpm.log || true

      - name: Build HAP (debug)
        run: |
          { hvigorw clean --no-daemon
            hvigorw assembleHap --mode module -p product=default -p buildMode=debug --no-daemon
          } > build.log 2>&1 || true
          echo "===== build.log (tail 150) ====="; tail -150 build.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            ohpm.log
          retention-days: 3

      - name: Fail if no HAP
        run: |
          ls -la entry/build/default/outputs/default/ || { echo "NO HAP PRODUCED"; tail -80 build.log; exit 1; }

      - name: Upload HAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: hap-debug
          path: entry/build/default/outputs/default/*.hap
          retention-days: 7
