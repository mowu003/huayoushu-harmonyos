name: Probe
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/sanchuanhehe/harmony-next-pipeline-docker/harmonyos-ci-image:v6.0.0.418SP-rc1
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          {
          echo '### PATH'; echo $PATH
          echo '### sdk-pkg'; cat /opt/harmonyos-tools/command-line-tools/sdk/*/sdk-pkg.json 2>/dev/null || find / -maxdepth 6 -name sdk-pkg.json 2>/dev/null
          echo '### ls opt'; ls -la /opt; ls -la /opt/harmonyos-tools/command-line-tools/sdk/ 2>/dev/null
          echo '### ets pkg'; cat /opt/harmonyos-tools/command-line-tools/sdk/*/*/ets/oh-uni-package.json 2>/dev/null
          echo '### hvigorw version'; hvigorw --version 2>&1 | tail -5
          } > probe.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe
          path: probe.log
