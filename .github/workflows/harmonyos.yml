name: Diag
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/sanchuanhehe/harmony-next-pipeline-docker/harmonyos-ci-image:v5.0.4
    steps:
      - name: Probe
        run: |
          set +e
          exec > probe.log 2>&1
          echo '### PATH'; echo $PATH
          echo '### /opt'; ls -la /opt
          echo '### /usr/local'; ls -la /usr/local
          echo '### find node'; find / -maxdepth 6 -name 'node' -type f 2>/dev/null | head
          echo '### find hvigorw'; find / -maxdepth 8 -name 'hvigorw*' 2>/dev/null | head
          echo '### find ohpm'; find / -maxdepth 8 -name 'ohpm*' -type f 2>/dev/null | head
          echo '### java'; java -version 2>&1
          echo '### SDK'; ls /opt 2>/dev/null; find / -maxdepth 4 -iname '*sdk*' -type d 2>/dev/null | head -20
          echo '### root dirs'; ls -la /
          cat probe.log
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe
          path: probe.log
