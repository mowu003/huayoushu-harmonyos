name: Build HarmonyOS HAP (API 26)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  CLT_URL: https://github.com/jerry-271828/harmonyos-commandline-tools/releases/download/v26.0.0.461

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache HarmonyOS CLI tools
        id: clt-cache
        uses: actions/cache@v4
        with:
          path: /opt/clt
          key: clt-26.0.0.461

      - name: Download Command Line Tools (API 26)
        if: steps.clt-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          sudo mkdir -p /opt/clt
          curl -fL --retry 3 -o clt.zip.part00 "$CLT_URL/clt.zip.part00"
          curl -fL --retry 3 -o clt.zip.part01 "$CLT_URL/clt.zip.part01"
          cat clt.zip.part00 clt.zip.part01 > clt.zip
          sha256sum clt.zip
          sudo unzip -q clt.zip -d /opt/clt
          ls /opt/clt

      - name: Build HAP
        run: |
          set -x
          CLT=$(dirname "$(find /opt/clt -maxdepth 3 -type d -name command-line-tools | head -1)")
          export COMMANDLINE_TOOL_DIR="$CLT"
          export PATH="$CLT/command-line-tools/bin:$CLT/command-line-tools/tool/node/bin:$PATH"
          hvigorw -v || true
          ohpm install --all 2>&1 | tail -20
          hvigorw clean --no-daemon
          hvigorw assembleHap --mode module -p product=default -p buildMode=debug --no-daemon
          ls -la entry/build/default/outputs/default/

      - name: Upload HAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hap-debug
          path: entry/build/default/outputs/default/**/*.hap
          if-no-files-found: warn
          retention-days: 14
