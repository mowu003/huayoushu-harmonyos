name: Probe API
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  CLT_URL: https://github.com/jerry-271828/harmonyos-commandline-tools/releases/download/v26.0.0.461
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - id: c
        uses: actions/cache@v4
        with: { path: /opt/clt, key: clt-26.0.0.461 }
      - if: steps.c.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /opt/clt && sudo chown $USER /opt/clt
          curl -fL -o a $CLT_URL/clt.zip.part00; curl -fL -o b $CLT_URL/clt.zip.part01
          cat a b > c.zip && unzip -q c.zip -d /opt/clt
      - name: Grep
        run: |
          {
          A=/opt/clt/command-line-tools/sdk/default/openharmony/ets/api
          echo '===== floatingBall methods ====='
          grep -nE '^\s+(on|off|[a-zA-Z]+)\(|declare (class|interface)|^\s+[a-zA-Z]+\??:' $A/@ohos.window.floatingBall.d.ts | head -80
          echo '===== floatView config ====='
          grep -nE 'FloatViewConfiguration|isConfirm|templateType|interface |^\s+[a-zA-Z]+\??:' $A/@ohos.window.floatView.d.ts | head -80
          } > probe.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: probe, path: probe.log }
